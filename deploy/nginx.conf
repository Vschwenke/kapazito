# Nginx-Reverse-Proxy fuer Kapazito auf Strato vServer.
# Datei nach /etc/nginx/sites-available/kapazito und symlink nach sites-enabled.
# Anschliessend: certbot --nginx -d app.kapazito.de

server {
    listen 80;
    listen [::]:80;
    server_name app.kapazito.de;

    # Redirect HTTP -> HTTPS (certbot fuegt das automatisch ein)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.kapazito.de;

    # SSL via Let's Encrypt (certbot fuellt das aus)
    # ssl_certificate     /etc/letsencrypt/live/app.kapazito.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.kapazito.de/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security-Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload-Limit fuer Datei-Uploads (Belege, Logo)
    client_max_body_size 25m;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
    gzip_vary on;

    # Proxy zur Next.js-App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Streaming fuer Kapi-Chat (SSE)
    location /api/kapi/chat {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Statische Next.js-Assets laenger cachen
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
