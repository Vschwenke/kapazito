# Codespaces docker-compose.
# Ein Dev-Container laeuft als `app`, Postgres als Sidecar.
version: "3.9"

services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bookworm
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
      - node_modules:/workspaces/${localWorkspaceFolderBasename}/node_modules
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    network_mode: service:db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kapazito
      POSTGRES_PASSWORD: kapazito_dev
      POSTGRES_DB: kapazito
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapazito"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  node_modules:
