# Produktions-Stack fuer Strato vServer.
#
# Setup-Schritte (einmalig auf dem Server):
#   1. apt update && apt install -y docker.io docker-compose-plugin nginx certbot python3-certbot-nginx
#   2. mkdir -p /srv/kapazito && cd /srv/kapazito
#   3. Dieses File + .env.prod hierher kopieren
#   4. Nginx-Config aus deploy/nginx.conf nach /etc/nginx/sites-available/kapazito
#   5. certbot --nginx -d app.kapazito.de
#   6. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Backup-Strategie:
#   Taeglicher Postgres-Dump via cron (siehe deploy/backup.sh).
#   Storage-Volume via rsync oder Borg auf Remote-Backup-Target.
version: "3.9"

services:
  app:
    image: ghcr.io/vschwenke/kapazito:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    ports:
      - "127.0.0.1:3000:3000"   # Nur lokal erreichbar, Nginx proxyt
    volumes:
      - /srv/kapazito/storage/files:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/kapazito/storage/db:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /srv/kapazito/storage/redis:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]

  # Backup-Service: taeglich um 03:00 Dump anlegen
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - /srv/kapazito/storage/backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 86400
          ts=$$(date +%Y-%m-%d_%H%M%S)
          pg_dump -Fc -f /backups/kapazito_$$ts.dump
          find /backups -name "kapazito_*.dump" -mtime +30 -delete
          echo "Backup erstellt: kapazito_$$ts.dump"
        done
